name: Build AutoDNA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --noconfirm AutoDNA.spec
        working-directory: ${{ github.workspace }}/AutoDNA

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDNA
          path: dist/AutoDNA/
          retention-days: 90