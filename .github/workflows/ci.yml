name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true   # advisory only — lint never blocks the build

      - name: Run tests with coverage
        run: pytest --cov=app --cov=stm32/bin_parser --cov=ai/preprocessing --cov-report=term-missing -v